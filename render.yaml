# Existing external PostgreSQL database; no additional database is provisioned.
# Free Node service with Brevo HTTPS email delivery.
services:
  - type: web
    name: suraksha-setu
    runtime: node
    plan: free
    region: singapore
    numInstances: 1
    rootDir: backend
    buildCommand: npm --prefix ../admin install --include=dev && npm --prefix ../admin run build && npm install --omit=dev
    startCommand: npm run migrate && npm run seed && npm start
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OTP_PEPPER
        sync: false
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: SurakshaSetu
      - key: BOOTSTRAP_ORG
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_SECOND_ADMIN_EMAIL
        sync: false
