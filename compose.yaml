services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suraksha
      POSTGRES_USER: suraksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suraksha"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
