services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: suraksha
      POSTGRES_USER: suraksha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suraksha"]
      interval: 5s
      retries: 10
    restart: unless-stopped
  api:
    build:
      context: ..
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Internal PostgreSQL connection string required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      OTP_PEPPER: ${OTP_PEPPER:?OTP pepper required}
      PUBLIC_URL: https://${APP_DOMAIN:?Public domain required}
      SMTP_HOST: ${SMTP_HOST:?SMTP host required}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:?SMTP username required}
      SMTP_PASS: ${SMTP_PASS:?SMTP password required}
      SMTP_FROM: ${SMTP_FROM:?SMTP sender required}
      BOOTSTRAP_ORG: ${BOOTSTRAP_ORG:-demo}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_SECOND_ADMIN_EMAIL: ${BOOTSTRAP_SECOND_ADMIN_EMAIL:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/firebase/service-account.json
      PROXY_HOPS: 1
    volumes:
      - ${FIREBASE_CREDENTIALS_DIR:-./credentials}:/run/firebase:ro
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Public domain required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    restart: unless-stopped
volumes:
  pgdata:
  caddy_data:
  caddy_config:
